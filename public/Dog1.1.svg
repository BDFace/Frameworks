    <path class="grass-bg" d="
      M40,540 L85,670 M100,520 L130,680 M160,550 L145,690 M210,530 L245,685 M270,545 L260,700 
      M310,525 L355,690 M380,550 L365,705 M430,535 L455,680 M490,520 L470,695 M540,540 L575,700 
      M600,525 L590,685 M650,545 L685,710 M70,660 L115,790 M140,640 L120,810 M180,670 L220,800 
