<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 950" width="100%" height="100%">
  <defs>
    <!-- Paper Texture & Tonal Filter -->
    <filter id="paper-texture" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise" />
      <feColorMatrix type="matrix" values="0 0 0 0 0.94  0 0 0 0 0.93  0 0 0 0 0.91  0 0 0 0.08 0" />
      <feBlend mode="multiply" in="SourceGraphic" />
    </filter>
    
    <style>
      .grass-bg { stroke: #5a6358; stroke-width: 1.2; stroke-linecap: round; opacity: 0.85; fill: none; }
      .grass-mid { stroke: #7b8577; stroke-width: 1.0; stroke-linecap: round; opacity: 0.9; fill: none; }
      .grass-fore { stroke: #414a3e; stroke-width: 1.4; stroke-linecap: round; fill: none; }
      .grass-light { stroke: #adb7a8; stroke-width: 0.9; stroke-linecap: round; opacity: 0.8; fill: none; }
      .dog-fur-base { fill: #f3f3f0; stroke: #2a2c28; stroke-width: 1.2; }
      .dog-stroke { stroke: #1e201d; stroke-width: 1.3; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .dog-shade { stroke: #454942; stroke-width: 1.0; stroke-linecap: round; fill: none; }
      .dog-accent { fill: #1a1a1a; }
